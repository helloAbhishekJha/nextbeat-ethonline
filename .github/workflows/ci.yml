name: ci

on:
  push:
    paths:
      - "nextbeat-app/**"
  pull_request:
    paths:
      - "nextbeat-app/**"

defaults:
  run:
    working-directory: nextbeat-app

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: nextbeat-app/package-lock.json
      - run: npm ci
      - run: npm run test
      - run: npm run typecheck
